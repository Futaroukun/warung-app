plugins {
    id 'com.android.application'
}

def getBuildNumber() {
    def val = System.getenv("BUILD_NUMBER")
    if (val != null && val.toString().trim().isInteger()) {
        return val.toString().trim().toInteger()
    }
    return 1
}

android {
    namespace 'com.warungpro.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.warungpro.app"
        minSdk 24
        targetSdk 34
        versionCode getBuildNumber()
        versionName "1.2." + getBuildNumber()
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "warungpro.keystore")
            storePassword System.getenv("KEYSTORE_PASS") ?: "warungpro123"
            keyAlias System.getenv("KEY_ALIAS") ?: "warungpro"
            keyPassword System.getenv("KEY_PASS") ?: "warungpro123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug juga pakai signingConfig release agar signature konsisten
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
