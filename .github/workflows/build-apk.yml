name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      KEYSTORE_PATH: warungpro.keystore
      KEYSTORE_PASS: warungpro123
      KEY_ALIAS: warungpro
      KEY_PASS: warungpro123

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Unit Tests
        run: npm test

      - name: Sync Frontend Assets to Android Project
        run: npm run sync-assets

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Ensure Permanent Signing Keystore
        working-directory: android/app
        run: |
          if [ ! -f warungpro.keystore ]; then
            echo "Generating permanent release keystore..."
            keytool -genkey -v -keystore warungpro.keystore \
              -alias warungpro \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=WarungPro, OU=Production, O=WarungPro, L=Jakarta, ST=DKI, C=ID" \
              -storepass warungpro123 -keypass warungpro123 \
              -noprompt
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add warungpro.keystore
            git commit -m "chore(keystore): permanent release signing key [skip ci]" || true
            git push origin main || true
          else
            echo "Permanent keystore exists. Reusing key for consistent signature."
          fi

      - name: Build Release APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: warungpro.keystore
          KEYSTORE_PASS: warungpro123
          KEY_ALIAS: warungpro
          KEY_PASS: warungpro123
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kasir-Warung-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-build${{ github.run_number }}
          name: Kasir Warung APK v1.2.0 (Build #${{ github.run_number }})
          body: |
            ## 📱 Kasir Warung - Aplikasi Kasir, Stok & Kasbon Pintar
            Build otomatis via GitHub Actions (Official Signed Release APK).

            ### ✨ Fitur Terbaru:
            - **Signed Production Release**: Build release non-debug tanpa izin mencurigakan untuk meminimalkan peringatan Play Protect.
            - **Katalog Master Barcode**: Penambahan dan penghapusan produk permanen langsung sinkron.
            - **Multi-Database Barcode**: Dukungan pencarian online multi-sumber (OpenFoodFacts, OpenProductsFacts, OpenBeautyFacts).
            - **Realtime Sync**: Data stok, transaksi POS, buku kasbon, dan riwayat tersinkronisasi otomatis secara realtime.
            - **Filter Chip Dinamis**: Highlight hijau berpindah mulus di kasir, riwayat, dan kasbon.
            - **Auto Kapitalisasi**: Pengetikan nama barang, kategori, dan pelanggan otomatis Title Case secara instan.
            - **Backup Database**: Unduh snapshot binary `warung.db` & ekspor CSV Excel.
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

